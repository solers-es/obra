name: Publicar Brigada Web (Hetzner)

# AUTOMATICO al fusionar/empujar a main + boton (Actions -> Run workflow). Sube el codigo a un
# staging del servidor y alli crea una version nueva = lo publicado + lo del repo ENCIMA (nunca
# borra api/, sync.js, config.js...); reenlaza atomico y reinicia. Si falla, no reenlaza.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar la llave del servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 91.99.92.242 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Subir el codigo a staging
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no root@91.99.92.242 "mkdir -p /srv/staging/brigada"
          rsync -az --delete \
            --exclude .git --exclude .github --exclude supabase --exclude node_modules --exclude .gitignore \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ root@91.99.92.242:/srv/staging/brigada/

      - name: Publicar (version nueva + symlink)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no root@91.99.92.242 "bash /root/publicar-estatica.sh brigada"
